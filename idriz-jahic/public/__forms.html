<!doctype html>
<html lang="sl">
<head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Obrazec</title></head>
<body>
  <!-- Statična definicija obrazca, po kateri Netlify Forms ob objavi prepozna obrazec iz React aplikacije. -->
  <form name="povprasevanje" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input name="bot-field">
    <input name="ime">
    <input name="telefon">
    <input name="email">
    <input name="storitev">
    <textarea name="sporocilo"></textarea>
    <input name="soglasje">
  </form>
</body>
</html>
